name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"  # chaque lundi : une nouvelle règle peut trouver une faille ancienne

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read           # CodeQL lit l'état de son propre run (sans ça : « Resource not accessible by integration »)
      security-events: write  # publier les résultats dans l'onglet Security
    strategy:
      fail-fast: false
      matrix:
        # javascript-typescript s'ajoute avec le dossier site/ : CodeQL échoue
        # sur un langage dont il ne trouve aucun fichier.
        language: [python, actions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
