name: CI

on:
  push:
    branches: [main]
  pull_request:

# Le jeton du workflow ne peut que lire le dépôt : les tests n'écrivent rien.
permissions:
  contents: read

jobs:
  test:
    # L'application est Windows-only (winreg, game_capture, ImageGrab), et la
    # suite tourne sans OBS ni Steam : un runner Windows suffit.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 est le plancher réel : numpy 2.5.1, épinglé dans
        # requirements.txt, exige Python >=3.12 et n'a aucune roue pour 3.11
        # (« No matching distribution found for numpy==2.5.1 »). 3.14 est la
        # version sous laquelle le .exe est construit — sans elle la CI ne
        # testerait jamais l'interpréteur qui sert réellement au packaging.
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest tests/ -q

      - name: Vérifier la cohérence i18n
        # Échoue si une clé t("...") du code n'existe pas dans i18n.json, ou
        # si une langue secondaire est incomplète.
        run: |
          python -c "
          import sys, build
          missing = build.check_i18n_integrity()
          if missing:
              print('Cles i18n manquantes :', missing); sys.exit(1)
          gaps = build.check_all_langs_consistent()
          if gaps:
              print('Langues incompletes :', gaps); sys.exit(1)
          print('i18n OK')
          "

      - name: Vérifier que l'application s'importe
        run: python -c "import obs_dynamics; print('import OK')"

      - name: Aucun secret dans le dépôt
        # Le hook pre-commit est local : il ne protège ni un clone frais où
        # personne n'a posé core.hooksPath, ni un commit passé avec
        # --no-verify. Ce contrôle-ci est le filet qui ne s'oublie pas.
        run: python check_secrets.py --all

      - name: Vulnérabilités connues des dépendances
        # Les versions sont épinglées, donc elles vieillissent : sans ce
        # contrôle, une faille publiée après l'épinglage resterait dans le
        # build sans que rien ne le signale. Échoue si une CVE touche une
        # version listée dans requirements.txt OU requirements-dev.txt : les
        # outils de build (PyInstaller) et de génération des logos tournent
        # eux aussi sur la machine du développeur, avec ses droits.
        # requirements-dev.txt inclut requirements.txt (-r).
        run: |
          pip install pip-audit
          pip-audit -r requirements-dev.txt
