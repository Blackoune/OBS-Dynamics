name: Site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', '.github/workflows/site.yml']
  # Aussi lancé par release.yml : la page Installation affiche la nouvelle version.
  workflow_dispatch:

permissions:
  contents: read

# Un seul déploiement à la fois ; celui en cours va jusqu'au bout.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Installer les dépendances (versions exactes du lockfile)
        run: npm ci

      - name: Vulnérabilités connues
        run: npm audit --audit-level=high

      - name: Vérifier les types
        run: npx astro check

      - name: Contrôler les données de la FAQ
        run: npm test

      - name: Construire et contrôler dist/ (check-dist.mjs)
        # Le jeton ne sert qu'à lire la dernière release pendant le build
        # (limite de l'API GitHub plus haute). Il n'arrive jamais dans le site.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    # Pas de déploiement depuis une pull request, ni tant que le dépôt est
    # privé (GitHub Pages y est payant).
    if: ${{ github.ref == 'refs/heads/main' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
