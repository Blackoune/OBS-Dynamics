name: Audit de l'historique (gitleaks)

# Seconde lecture de TOUT l'historique, indépendante de check_secrets.py :
# d'autres motifs, écrits par d'autres gens. Lancement manuel, avant le
# passage en public puis après chaque réécriture de l'historique.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # Empreinte publiée dans gitleaks_8.30.1_checksums.txt : un binaire
      # modifié en route ne s'exécute pas.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # tout l'historique, pas seulement le dernier commit

      - name: Installer gitleaks (empreinte vérifiée)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" gitleaks

      - name: Analyser chaque commit
        # --redact : le journal de CI est public, il ne doit jamais afficher
        # la valeur d'un secret trouvé, seulement sa position.
        run: ./gitleaks git --redact --verbose --log-opts="--all" .
